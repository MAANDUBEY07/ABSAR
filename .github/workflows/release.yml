name: Production release checks
on:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements.txt -c backend/requirements.lock.txt
      - run: python backend/scripts/validate_dependencies.py
      - run: cd backend && pytest -q
      - run: docker build -t opportunityos-release ./backend
