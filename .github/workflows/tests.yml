name: Backend and frontend checks
on:
  push:
    branches: [main, develop, backend-branch, backend-code]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements.txt -c requirements.lock.txt
      - run: python scripts/validate_dependencies.py
      - run: ruff check main.py app migrations scripts
      - run: ruff format --check main.py app migrations scripts
      - name: Run backend tests from app/tests
        run: python -m pytest app/tests -q
      - run: alembic upgrade head && alembic check
      - run: python -m app.manage indexes && python -m app.manage checkpoints
      - run: bandit -r main.py app -x app/tests -q
      - run: pip-audit -r requirements.lock.txt --no-deps --disable-pip
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
