name: Optional AWS adapter preflight
on:
  workflow_dispatch:
    inputs:
      role_arn:
        description: Existing IAM OIDC role ARN
        required: true
        type: string
      region:
        description: Existing AWS region
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate supplied configuration
        env:
          ROLE_ARN: ${{ inputs.role_arn }}
          REGION: ${{ inputs.region }}
        run: |
          [[ "$ROLE_ARN" =~ ^arn:aws(-us-gov|-cn)?:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]+$ ]] || exit 1
          [[ "$REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]] || exit 1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.region }}
      - name: Derive authenticated account
        run: aws sts get-caller-identity --query Account --output text
