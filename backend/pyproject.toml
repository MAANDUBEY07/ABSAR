[project]
name = "opportunityos-backend"
version = "1.0.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["app/tests", "tests/test_resume.py", "tests/test_scraper.py", "tests/test_trust.py"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["app/tests/manual_gemini_test.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/tests/conftest.py" = ["E402"] # Environment must be set before app imports.
