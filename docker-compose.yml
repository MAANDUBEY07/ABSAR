services:
  api:
    build: ./backend
    ports: ["10000:10000"]
    environment: &environment
      ENVIRONMENT: development
      AUTH_PROVIDER: local
      DATABASE_URL: sqlite:////data/opportunityos.db
      CAREER_CHECKPOINT_DB: /data/checkpoints.sqlite
      REDIS_URL: redis://redis:6379/0
      JOBS_EAGER: "false"
      AI_PROVIDER: deterministic
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: ["data:/data"]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_started
  initialize:
    build: ./backend
    user: root
    command: sh -c 'chown 10001:10001 /data && alembic upgrade head && python -m app.manage checkpoints && chown 10001:10001 /data/*'
    environment: *environment
    volumes: ["data:/data"]
  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --concurrency=2 --loglevel=INFO
    environment: *environment
    volumes: ["data:/data"]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_started
  scheduler:
    build: ./backend
    command: celery -A app.worker.celery beat --schedule=/tmp/celerybeat --loglevel=INFO
    environment: *environment
    volumes: ["data:/data"]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_started
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
volumes:
  data:
  redis:
